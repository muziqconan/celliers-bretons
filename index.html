function useIsMobile() {
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < 820 : false);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 820);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return isMobile;
}

const SUPABASE_URL = "https://xpoqetlmdwyboxakgwtr.supabase.co";
const SUPABASE_KEY = "sb_publishable_BdSoO2jfZ77JxQUlQ-79xg_U4vNAX56";
const AUTH_STORAGE_KEY = "cb_auth_session";

function getStoredSession() {
  try {
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function storeSession(session) {
  try {
    if (session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch (e) {}
}

async function authSignIn(email, password) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || "Connexion impossible");
  const session = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + data.expires_in * 1000, email };
  storeSession(session);
  return session;
}

async function authRefresh(refresh_token) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error("refresh failed");
  const session = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + data.expires_in * 1000, email: data.user && data.user.email };
  storeSession(session);
  return session;
}

async function authSignOut() {
  storeSession(null);
}

// Recupere une session valide (rafraichit si le token va bientot expirer). Retourne null si pas connecte.
async function ensureValidSession() {
  let session = getStoredSession();
  if (!session) return null;
  if (session.expires_at - Date.now() < 60000) {
    try {
      session = await authRefresh(session.refresh_token);
    } catch (e) {
      storeSession(null);
      return null;
    }
  }
  return session;
}

function currentAuthHeaders() {
  const session = getStoredSession();
  const token = session ? session.access_token : SUPABASE_KEY;
  return {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + token,
    "Content-Type": "application/json",
  };
}

async function sbFetch(path, options) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: { ...currentAuthHeaders(), ...(options && options.headers) },
  });
  const text = await res.text();
  if (!res.ok) {
    throw new Error("Supabase " + res.status + ": " + text);
  }
  if (!text) return null;
  return JSON.parse(text);
}

// Recupere TOUTES les lignes d'une table (pagination automatique, PostgREST limite a 1000 par defaut)
async function sbFetchAll(pathBase, pageSize) {
  pageSize = pageSize || 1000;
  let all = [];
  let from = 0;
  while (true) {
    const sep = pathBase.includes("?") ? "&" : "?";
    const rows = await sbFetch(pathBase + sep + "offset=" + from + "&limit=" + pageSize);
    all = all.concat(rows);
    if (rows.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function sbUpsert(table, rows, conflictCols) {
  if (!rows.length) return;
  const chunkSize = 300;
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    await sbFetch(table, {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify(chunk),
    });
  }
}

function lightNormalize(n) {
  if (!n) return "";
  let s = String(n).trim().toUpperCase();
  s = s.replace(/\*+/g, "");
  s = s.replace(/\s+/g, " ").trim();
  return s;

function deptFromCp(cp) {
  if (!cp) return null;
  const s = String(cp).trim().padStart(5, "0");
  if (s.startsWith("97") || s.startsWith("98")) return s.slice(0, 3);
  return s.slice(0, 2);
}

function initials(nom) {
  const words = (nom || "").split(" ").filter(Boolean);
  return (words[0]?.[0] || "") + (words[1]?.[0] || "");
}

function fmtEuro(v) {
  if (v === null || v === undefined) return DASH;
  return v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + " \u20ac";
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function fmtDateFr(dateStr) {
  if (!dateStr) return "Jamais enregistree";
  const [y, m, d] = dateStr.split("-");
  return d + "/" + m + "/" + y;
}

function ClientNotesPanel({ client, onClientUpdated }) {
  const [notes, setNotes] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ rue: "", cp: "", tel: "", mob: "", email: "", gerant: "", nom_public: "", commercial: "" });
  const [visitDate, setVisitDate] = useState(todayStr());
  const [visitObs, setVisitObs] = useState("");
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const speechSupported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  function toggleDictation() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      return;
    }
    const rec = new SR();
    rec.lang = "fr-FR";
    rec.continuous = true;
    rec.interimResults = false;
    const baseText = visitObs.trim();
    rec.onresult = (e) => {
      let addition = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) addition += e.results[i][0].transcript;
      }
      if (addition.trim()) {
        setVisitObs((prev) => (prev.trim() ? prev.trim() + " " : "") + addition.trim());
      }
    };
    rec.onerror = () => setListening(false);
    rec.onend = () => setListening(false);
    recognitionRef.current = rec;
    rec.start();
    setListening(true);
  }
  const [saveError, setSaveError] = useState("");

  const idEnc = encodeURIComponent(client.nom_norm);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setEditing(false);
    (async () => {
      try {
        const rows = await sbFetch("client_notes?client_nom_norm=eq." + idEnc + "&select=overrides,visites");
        const row = rows && rows[0];
        const overrides = (row && row.overrides) || {};
        const visites = (row && row.visites) || [];
        if (!cancelled) {
          setNotes({ overrides, visites });
          setForm({
            rue: overrides.rue ?? client.rue ?? "",
            cp: overrides.cp ?? client.cp ?? "",
            tel: overrides.tel ?? client.tel ?? "",
            mob: overrides.mob ?? client.mob ?? "",
            email: overrides.email ?? client.email ?? "",
            gerant: overrides.gerant ?? client.gerant ?? "",
            nom_public: client.nom_public ?? "",
            commercial: client.commercial ?? "",
          });
        }
      } catch (e) {
        if (!cancelled) {
          setNotes({ overrides: {}, visites: [] });
          setForm({
            rue: client.rue || "", cp: client.cp || "", tel: client.tel || "",
            mob: client.mob || "", email: client.email || "", gerant: client.gerant || "",
            nom_public: client.nom_public || "", commercial: client.commercial || "",
          });
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [client.nom_norm]);

  async function persist(updated) {
    await sbFetch("client_notes", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify([{ client_nom_norm: client.nom_norm, overrides: updated.overrides, visites: updated.visites }]),
    });
  }

  async function saveField() {
    const overridesOnly = { rue: form.rue, cp: form.cp, tel: form.tel, mob: form.mob, email: form.email, gerant: form.gerant };
    const updated = { ...notes, overrides: overridesOnly };
    try {
      await persist(updated);
      await sbFetch("clients?nom_norm=eq." + idEnc, {
        method: "PATCH",
        body: JSON.stringify({ nom_public: form.nom_public || null, commercial: form.commercial || null }),
      });
      setNotes(updated);
      setEditing(false);
      setSaveError("");
      if (onClientUpdated) onClientUpdated();
    } catch (e) {
      setSaveError("Enregistrement impossible, reessayez.");
    }
  }

  async function addVisit() {
    if (!visitDate) { setSaveError("Choisissez une date de visite."); return; }
    const visite = { date: visitDate, observations: visitObs.trim() };
    const updated = { ...notes, visites: [visite, ...(notes.visites || [])] };
    try {
      await persist(updated);
      setNotes(updated);
      setVisitObs("");
      setVisitDate(todayStr());
      setSaveError("");
    } catch (e) {
      setSaveError("Enregistrement impossible, reessayez.");
    }
  }

  if (loading || !notes) {
    return <div style={{ fontSize: 12, color: PALETTE.inkSoft, padding: "8px 0" }}>Chargement...</div>;
  }

  const lastVisit = notes.visites && notes.visites.length > 0 ? notes.visites[0] : null;
  const rue = notes.overrides.rue || client.rue;
  const cp = notes.overrides.cp || client.cp;
  const tel = notes.overrides.tel || client.tel;
  const mob = notes.overrides.mob || client.mob;
  const email = notes.overrides.email || client.email;
  const gerant = notes.overrides.gerant || client.gerant;

  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: PALETTE.ink }}>Coordonnees</div>
        {!editing && <button onClick={() => setEditing(true)} style={secondaryBtnStyle}>Modifier</button>}
      </div>

      {editing ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          <input placeholder="Nom public (ex: Creperie Hirondelle)" value={form.nom_public} onChange={(e) => setForm({ ...form, nom_public: e.target.value })} style={inputStyle} />
          <input placeholder="Commercial en charge" value={form.commercial} onChange={(e) => setForm({ ...form, commercial: e.target.value })} style={inputStyle} />
          <input placeholder="Rue" value={form.rue} onChange={(e) => setForm({ ...form, rue: e.target.value })} style={inputStyle} />
          <input placeholder="Code postal" value={form.cp} onChange={(e) => setForm({ ...form, cp: e.target.value })} style={inputStyle} />
          <input placeholder="Gerant / contact" value={form.gerant} onChange={(e) => setForm({ ...form, gerant: e.target.value })} style={inputStyle} />
          <input placeholder="Telephone fixe" value={form.tel} onChange={(e) => setForm({ ...form, tel: e.target.value })} style={inputStyle} />
          <input placeholder="Telephone portable" value={form.mob} onChange={(e) => setForm({ ...form, mob: e.target.value })} style={inputStyle} />
          <input placeholder="Email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} style={inputStyle} />
          <div style={{ display: "flex", gap: 6, marginTop: 2 }}>
            <button onClick={saveField} style={primaryBtnStyle}>Enregistrer</button>
            <button onClick={() => setEditing(false)} style={secondaryBtnStyle}>Annuler</button>
          </div>
        </div>
      ) : (
        <div style={{ fontSize: 12.5, color: PALETTE.ink, marginBottom: 10, lineHeight: 1.7 }}>
          {client.nom_public && <div style={{ fontStyle: "italic", color: PALETTE.inkSoft }}>Nom public : {client.nom_public}</div>}
          {client.commercial && <div>Commercial : {client.commercial}</div>}
          <div>{rue || "Rue non renseignee"}{cp ? ", " + cp : ""} {client.ville}</div>
          <div>Gerant / contact : {gerant || "non renseigne"}</div>
          <div>Fixe : {tel || "non renseigne"} &middot; Portable : {mob || "non renseigne"}</div>
          <div>Email : {email || "non renseigne"}</div>
          {client.com && <div style={{ marginTop: 4, fontStyle: "italic", color: PALETTE.inkSoft }}>Note ERP : {client.com}</div>}
        </div>
      )}

      {saveError && <div style={{ fontSize: 11.5, color: PALETTE.rust, marginBottom: 8 }}>{saveError}</div>}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 14, marginBottom: 6 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: PALETTE.ink }}>Journal de visites</div>
        <div style={{ fontSize: 11.5, color: PALETTE.inkSoft }}>
          {lastVisit ? "Derniere visite notee : " + lastVisit.date : "Aucune visite enregistree"}
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 10, alignItems: "flex-start", flexWrap: "wrap" }}>
        <input type="date" value={visitDate} onChange={(e) => setVisitDate(e.target.value)} style={{ ...inputStyle, flex: "0 0 140px" }} />
        <input placeholder="Observations de la visite..." value={visitObs} onChange={(e) => setVisitObs(e.target.value)} style={{ ...inputStyle, flex: "1 1 160px" }} />
        {speechSupported && (
          <button
            type="button"
            onClick={toggleDictation}
            title={listening ? "Arreter la dictee" : "Dicter au micro"}
            style={{
              fontSize: 14, padding: "7px 12px", borderRadius: 7, cursor: "pointer",
              border: "1px solid " + (listening ? PALETTE.rust : PALETTE.line),
              background: listening ? PALETTE.rust : "transparent",
              color: listening ? "#fff" : PALETTE.inkSoft,
            }}
          >
            {listening ? "\u23f9 Enregistrement..." : "\ud83c\udfa4 Dicter"}
          </button>
        )}
        <button onClick={addVisit} style={primaryBtnStyle}>Ajouter</button>
      </div>

      <div style={{ maxHeight: 150, overflowY: "auto" }}>
        {(notes.visites || []).length === 0 && (
          <div style={{ fontSize: 12, color: PALETTE.inkSoft }}>Pas encore de visite enregistree pour ce client.</div>
        )}
        {(notes.visites || []).map((v, i) => (
          <div key={i} style={{ borderLeft: "2px solid " + PALETTE.gold, paddingLeft: 10, marginBottom: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: PALETTE.ink }}>{v.date}</div>
            <div style={{ fontSize: 12, color: PALETTE.inkSoft }}>{v.observations || "(sans observation)"}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function readFileAsText(file, encoding) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const buf = reader.result;
        const text = new TextDecoder(encoding || "iso-8859-1").decode(buf);
        resolve(text);
      } catch (e) { reject(e); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parseFrDate(s) {
  if (!s) return null;
  const parts = String(s).trim().split(/[\/\-]/);
  if (parts.length !== 3) return null;
  const [d, m, y] = parts;
  if (!d || !m || !y) return null;
  return y.length === 4 ? y + "-" + m.padStart(2, "0") + "-" + d.padStart(2, "0") : null;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function geocodeAddress(rue, cp, ville) {
  const q = [rue, cp, ville].filter(Boolean).join(" ");
  if (!q.trim()) return null;
  const url = "https://api-adresse.data.gouv.fr/search/?q=" + encodeURIComponent(q) + "&limit=1";
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  const f = data.features && data.features[0];
  if (!f) return null;
  return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] };
}

function GeocodePane({ clientsToGeocode, onDone }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(null);
  const [status, setStatus] = useState(null);

  async function runGeocode() {
    setBusy(true);
    setStatus(null);
    let ok = 0, fail = 0;
    const failedNames = [];
    for (let i = 0; i < clientsToGeocode.length; i++) {
      const c = clientsToGeocode[i];
      setProgress({ current: i + 1, total: clientsToGeocode.length, nom: c.nom });
      try {
        let geo = await geocodeAddress(c.rue, c.cp, c.ville);
        if (!geo && (c.cp || c.ville)) {
          // repli : on retente sans le numero de rue, juste ville + code postal
          geo = await geocodeAddress("", c.cp, c.ville);
        }
        if (geo) {
          await sbFetch("clients?nom_norm=eq." + encodeURIComponent(c.nom_norm), {
            method: "PATCH",
            body: JSON.stringify({ lat: geo.lat, lon: geo.lon, geocoded_at: new Date().toISOString() }),
          });
          ok++;
        } else {
          fail++;
          failedNames.push(c.nom + (c.rue ? " (" + c.rue + ", " + c.ville + ")" : " (adresse incomplete: " + (c.ville || "ville inconnue") + ")"));
        }
      } catch (e) {
        fail++;
        failedNames.push(c.nom + " (erreur reseau)");
      }
      await sleep(150); // reste poli avec le service gratuit
    }
    setBusy(false);
    setProgress(null);
    setStatus({ ok, fail, failedNames });
    if (onDone) onDone();
  }

  return (
    <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 18 }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: PALETTE.bottleDark, marginBottom: 4 }}>
        Localiser les clients sur la carte
      </div>
      <div style={{ fontSize: 12.5, color: PALETTE.inkSoft, marginBottom: 12 }}>
        Convertit les adresses en coordonnees GPS (service gratuit officiel, aucune cle a gerer).
        {clientsToGeocode.length === 0
          ? " Tous les clients actifs sont deja localises."
          : " " + clientsToGeocode.length + " client(s) actif(s) sans coordonnees pour l'instant."}
      </div>
      {clientsToGeocode.length > 0 && (
        <button onClick={runGeocode} disabled={busy} style={primaryBtnStyle}>
          {busy ? "Localisation en cours..." : "Localiser " + clientsToGeocode.length + " client(s)"}
        </button>
      )}
      {progress && (
        <div style={{ marginTop: 10, fontSize: 12, color: PALETTE.inkSoft }}>
          {progress.current} / {progress.total} &mdash; {progress.nom}
        </div>
      )}
      {status && (
        <div style={{ marginTop: 10, fontSize: 12.5, color: PALETTE.bottle }}>
          {status.ok} localises, {status.fail ? status.fail + " adresses non trouvees." : "aucun echec."}
          {status.fail > 0 && (
            <ul style={{ margin: "6px 0 0", paddingLeft: 18, color: PALETTE.rust }}>
              {status.failedNames.map((n, i) => (
                <li key={i} style={{ fontSize: 12 }}>{n}</li>
              ))}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

function ImportPane({ onImported, clientsToGeocode }) {
  const [commission, setCommission] = useState("P1");
  const [clientsStatus, setClientsStatus] = useState(null);
  const [clientsBusy, setClientsBusy] = useState(false);
  const [ordersStatus, setOrdersStatus] = useState(null);
  const [ordersBusy, setOrdersBusy] = useState(false);

  async function handleClientsFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setClientsBusy(true);
    setClientsStatus(null);
    try {
      const text = await readFileAsText(file, "iso-8859-1");
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      const rows = parsed.data;

      const upsertsRaw = rows.map((r) => {
        const nom = (r.CUSNAME || "").trim();
        const gerant = (r.CUSSOCIALREASON || "").trim() || (r.CUSFIRSTNAME || "").trim();
        const email = (r.CUSEMAIL || "").trim() || (r.DELMAIL || "").trim();
        const mob = (r.CUSPORTABLEPHONE || "").trim() || (r.DELPHONEPORTABLE || "").trim();
        const cp = (r.CUSZIPCODE || "").trim();
        return {
          nom_norm: lightNormalize(nom),
          nom: nom,
          rue: (r.CUSADDRESS1 || "").trim(),
          cp: cp,
          ville: (r.CUSCITY || "").trim(),
          dept: deptFromCp(cp),
          tel: (r.CUSPHONE || "").trim(),
          mob: mob,
          email: email,
          gerant: gerant,
          commentaire: (r.CUSCOMMENT || "").trim(),
          commission: commission,
          derniere_commande: parseFrDate(r.CUSDATELASTORDER),
          updated_at: new Date().toISOString(),
        };
      }).filter((c) => c.nom_norm);

      // Deduplique par nom_norm (garde la derniere occurrence) : Postgres refuse
      // qu'un meme upsert touche deux fois la meme ligne dans un seul lot.
      const dedupMap = new Map();
      for (const c of upsertsRaw) dedupMap.set(c.nom_norm, c);
      const upserts = Array.from(dedupMap.values());
      const nbDoublons = upsertsRaw.length - upserts.length;

      await sbUpsert("clients", upserts);
      setClientsStatus({ ok: true, msg: upserts.length + " clients importes/mis a jour (commission " + commission + ")." + (nbDoublons ? " (" + nbDoublons + " doublons de nom fusionnes)" : "") });
      if (onImported) onImported();
    } catch (err) {
      setClientsStatus({ ok: false, msg: "Erreur : " + err.message });
    } finally {
      setClientsBusy(false);
      e.target.value = "";
    }
  }

  async function handleOrdersFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setOrdersBusy(true);
    setOrdersStatus(null);
    try {
      const buf = await readFileAsArrayBuffer(file);
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });

      // trouver la ligne d'en-tete (celle qui contient "CLINOM")
      let headerRowIdx = -1;
      for (let r = 0; r < Math.min(grid.length, 10); r++) {
        if ((grid[r] || []).some((v) => v === "CLINOM")) { headerRowIdx = r; break; }
      }
      if (headerRowIdx < 2) throw new Error("Format non reconnu (ligne d'en-tete CLINOM introuvable).");

      const yearRow = grid[headerRowIdx - 2] || [];
      const monthRow = grid[headerRowIdx - 1] || [];

      const monthCols = [];
      let curYear = null;
      for (let c = 0; c < monthRow.length; c++) {
        if (yearRow[c] !== null && yearRow[c] !== undefined && !isNaN(Number(yearRow[c]))) {
          curYear = Number(yearRow[c]);
        }
        const mLabel = monthRow[c];
        if (mLabel && MONTHS_FR_MAP[String(mLabel).trim()]) {
          monthCols.push({ year: curYear, month: MONTHS_FR_MAP[String(mLabel).trim()], qtyCol: c, amtCol: c + 1 });
        }
      }
      if (!monthCols.length) throw new Error("Aucune colonne mensuelle detectee (en-tetes de mois manquants).");

      const existingClients = await sbFetchAll("clients?select=nom_norm");
      const knownNoms = new Set(existingClients.map((c) => c.nom_norm));

      let currentNameRaw = null;
      let currentCat = null;
      const commandeRows = [];
      const newClientStubs = [];
      const seenNew = new Set();

      for (let r = headerRowIdx + 1; r < grid.length; r++) {
        const row = grid[r] || [];
        const nomCell = row[1];
        const catCell = row[2];
        const artNum = row[3];
        const artDes = row[4];

        if (catCell !== null && catCell !== undefined && !String(catCell).startsWith("Total")) currentCat = String(catCell).trim();
        if (nomCell !== null && nomCell !== undefined && String(nomCell).trim() !== "") currentNameRaw = String(nomCell).trim();
        if (artNum === null || artNum === undefined || artDes === null || artDes === undefined || !currentNameRaw) continue;

        const key = lightNormalize(currentNameRaw);
        if (!knownNoms.has(key) && !seenNew.has(key)) {
          seenNew.add(key);
          newClientStubs.push({ nom_norm: key, nom: currentNameRaw });
        }

        for (const mc of monthCols) {
          const q = row[mc.qtyCol];
          const amt = row[mc.amtCol];
          if (q) {
            commandeRows.push({
              client_nom_norm: key,
              code_produit: String(Math.trunc(Number(artNum))),
              designation: String(artDes).trim(),
              categorie: currentCat,
              annee: mc.year,
              mois: mc.month,
              quantite: Number(q),
              montant: amt ? Number(amt) : 0,
            });
          }
        }
      }

      if (newClientStubs.length) {
        await sbFetch("clients", { method: "POST", body: JSON.stringify(newClientStubs) });
      }
      const commandeDedupMap = new Map();
      for (const r of commandeRows) {
        const k = r.client_nom_norm + "|" + r.code_produit + "|" + r.annee + "|" + r.mois;
        const existing = commandeDedupMap.get(k);
        if (existing) {
          // Meme client/produit/mois trouve plusieurs fois dans le fichier : on ADDITIONNE
          // (plusieurs lignes du meme mois pour le meme produit doivent s'additionner, pas s'ecraser)
          existing.quantite += r.quantite;
          existing.montant += r.montant;
        } else {
          commandeDedupMap.set(k, { ...r });
        }
      }
      const commandeRowsDedup = Array.from(commandeDedupMap.values());
      const nbFusions = commandeRows.length - commandeRowsDedup.length;
      await sbUpsert("commandes_mensuelles", commandeRowsDedup);

      const monthsList = [...new Set(monthCols.map((m) => monthLabel(m.year, m.month)))].join(", ");
      setOrdersStatus({
        ok: true,
        msg: commandeRowsDedup.length + " lignes importees (" + monthsList + ")." +
          (nbFusions ? " " + nbFusions + " doublons detectes et additionnes (meme client/produit/mois sur plusieurs lignes)." : "") + " " +
          (newClientStubs.length ? newClientStubs.length + " nouveaux clients detectes (a completer via le fichier coordonnees)." : "Aucun nouveau client."),
      });
      if (onImported) onImported();
    } catch (err) {
      setOrdersStatus({ ok: false, msg: "Erreur : " + err.message });
    } finally {
      setOrdersBusy(false);
      e.target.value = "";
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 18 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: PALETTE.bottleDark, marginBottom: 4 }}>
          Importer un fichier coordonnees clients
        </div>
        <div style={{ fontSize: 12.5, color: PALETTE.inkSoft, marginBottom: 12 }}>
          Fichier CSV type CLIENTS_P1 ou CLIENTS_P3. Met a jour les clients existants et ajoute les nouveaux, sans rien supprimer.
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <select value={commission} onChange={(e) => setCommission(e.target.value)} style={inputStyle}>
            <option value="P1">Ce fichier = P1 (commission 1%)</option>
            <option value="P3">Ce fichier = P3 (commission 3%)</option>
          </select>
          <label style={{ ...primaryBtnStyle, display: "inline-block" }}>
            {clientsBusy ? "Import en cours..." : "Choisir le fichier CSV"}
            <input type="file" accept=".csv" onChange={handleClientsFile} disabled={clientsBusy} style={{ display: "none" }} />
          </label>
        </div>
        {clientsStatus && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: clientsStatus.ok ? PALETTE.bottle : PALETTE.rust }}>
            {clientsStatus.msg}
          </div>
        )}
      </div>

      <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 18 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: PALETTE.bottleDark, marginBottom: 4 }}>
          Importer un fichier de commandes mensuelles
        </div>
        <div style={{ fontSize: 12.5, color: PALETTE.inkSoft, marginBottom: 12 }}>
          Fichier Excel avec en-tetes d'annee/mois (comme Classeur3). Les mois deja presents sont mis a jour, les autres restent inchanges.
          Un fichier avec un seul mois (ex: septembre) fonctionne tout aussi bien qu'un historique complet.
        </div>
        <label style={{ ...primaryBtnStyle, display: "inline-block" }}>
          {ordersBusy ? "Import en cours (peut prendre une minute)..." : "Choisir le fichier Excel"}
          <input type="file" accept=".xlsx,.xls" onChange={handleOrdersFile} disabled={ordersBusy} style={{ display: "none" }} />
        </label>
        {ordersStatus && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: ordersStatus.ok ? PALETTE.bottle : PALETTE.rust }}>
            {ordersStatus.msg}
          </div>
        )}
      </div>

      <GeocodePane clientsToGeocode={clientsToGeocode} onDone={onImported} />
    </div>
  );
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function wazeUrl(lat, lon) {
  return "https://waze.com/ul?ll=" + lat + "," + lon + "&navigate=yes";
}
function gmapsUrl(lat, lon) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lon;
}

function CartePane({ clients, isMobile, onSelectClient }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef([]);
  const [search, setSearch] = useState("");
  const [center, setCenter] = useState(null);
  const [centerLabel, setCenterLabel] = useState("");
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState("");

  const geocoded = useMemo(() => clients.filter((c) => c.lat && c.lon), [clients]);

  useEffect(() => {
    if (!mapDivRef.current || mapRef.current) return;
    const map = L.map(mapDivRef.current).setView([46.6, 2.4], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 19,
    }).addTo(map);
    mapRef.current = map;
    return () => {
      map.remove();
      mapRef.current = null;
    };
  }, []);

  const nearest = useMemo(() => {
    if (!center) return [];
    return geocoded
      .map((c) => ({ ...c, dist: haversineKm(center.lat, center.lon, c.lat, c.lon) }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 20);
  }, [center, geocoded]);

  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];

    const toShow = center ? nearest : geocoded;
    toShow.forEach((c) => {
      const isAlert = c.joursDepuis !== null && c.joursDepuis !== undefined && c.joursDepuis >= 45;
      const isProspect = c.statut === "prospect";
      const isMine = (c.commercial || "Pierre") === "Pierre";
      const markerColor = isProspect ? "#2E5F82" : isAlert ? "#A8462F" : isMine ? "#3E4E31" : "#B8863B";
      const marker = L.circleMarker([c.lat, c.lon], {
        radius: 7,
        color: markerColor,
        fillColor: markerColor,
        fillOpacity: 0.85,
        weight: 1,
      }).addTo(map);
      const distTxt = c.dist !== undefined ? "<div>" + c.dist.toFixed(1) + " km</div>" : "";
      marker.bindPopup(
        "<div style='font-family:sans-serif;font-size:13px;min-width:160px'>" +
          "<b>" + c.nom + "</b><br/>" +
          (c.ville || "") + "<br/>" +
          distTxt +
          "<div style='margin-top:6px;display:flex;gap:6px;flex-wrap:wrap'>" +
          "<a href='" + wazeUrl(c.lat, c.lon) + "' target='_blank' style='background:#3E4E31;color:#fff;padding:4px 8px;border-radius:5px;text-decoration:none;font-size:12px'>Waze</a>" +
          "<a href='" + gmapsUrl(c.lat, c.lon) + "' target='_blank' style='background:#8A6425;color:#fff;padding:4px 8px;border-radius:5px;text-decoration:none;font-size:12px'>Google Maps</a>" +
          "<a href='#' class='cb-fiche-btn' style='background:#B8863B;color:#fff;padding:4px 8px;border-radius:5px;text-decoration:none;font-size:12px'>Fiche</a>" +
          "<a href='#' class='cb-nearby-btn' style='background:#2E5F82;color:#fff;padding:4px 8px;border-radius:5px;text-decoration:none;font-size:12px'>A proximite</a>" +
          "</div></div>"
      );
      marker.on("popupopen", (e) => {
        const el = e.popup.getElement();
        const btn = el && el.querySelector(".cb-fiche-btn");
        if (btn) {
          btn.onclick = (evt) => {
            evt.preventDefault();
            evt.stopPropagation();
            if (onSelectClient) onSelectClient(c);
          };
        }
        const nearbyBtn = el && el.querySelector(".cb-nearby-btn");
        if (nearbyBtn) {
          nearbyBtn.onclick = (evt) => {
            evt.preventDefault();
            evt.stopPropagation();
            setCenter({ lat: c.lat, lon: c.lon });
            setCenterLabel(c.nom_public || c.nom);
            map.closePopup();
          };
        }
      });
      markersRef.current.push(marker);
    });

    if (center) {
      const centerMarker = L.marker([center.lat, center.lon], {
        icon: L.divIcon({ className: "", html: "<div style='background:#B8863B;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,.4)'></div>" }),
      }).addTo(map);
      markersRef.current.push(centerMarker);
      map.setView([center.lat, center.lon], 11);
    } else if (geocoded.length) {
      const bounds = L.latLngBounds(geocoded.map((c) => [c.lat, c.lon]));
      map.fitBounds(bounds, { padding: [30, 30] });
    }
  }, [center, nearest, geocoded]);

  const suggestions = useMemo(() => {
    if (!search.trim()) return [];
    const q = search.trim().toLowerCase();
    return clients
      .filter((c) => c.lat && c.lon && (c.nom.toLowerCase().includes(q) || (c.nom_public || "").toLowerCase().includes(q) || (c.ville || "").toLowerCase().includes(q)))
      .slice(0, 8);
  }, [search, clients]);

  async function doSearch() {
    if (!search.trim()) return;
    setSearching(true);
    setSearchError("");
    const q = search.trim().toLowerCase();
    const matchClient = clients.find((c) => c.lat && c.lon && c.nom.toLowerCase().includes(q));
    if (matchClient) {
      setCenter({ lat: matchClient.lat, lon: matchClient.lon });
      setCenterLabel(matchClient.nom);
      setSearching(false);
      return;
    }
    try {
      const geo = await geocodeAddress(search, "", "");
      if (geo) {
        setCenter(geo);
        setCenterLabel(search);
      } else {
        setSearchError("Adresse ou ville introuvable.");
      }
    } catch (e) {
      setSearchError("Recherche impossible pour le moment.");
    } finally {
      setSearching(false);
    }
  }

  return (
    <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "minmax(0,1fr) minmax(0,360px)", gap: 16 }}>
      <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 12 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap", position: "relative" }}>
          <input
            placeholder="Ville, adresse, ou nom de client..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && doSearch()}
            style={{ ...inputStyle, flex: 1 }}
          />
          <button onClick={doSearch} disabled={searching} style={primaryBtnStyle}>
            {searching ? "..." : "Chercher"}
          </button>
          {center && (
            <button onClick={() => { setCenter(null); setCenterLabel(""); }} style={secondaryBtnStyle}>
              Reinitialiser
            </button>
          )}
          {suggestions.length > 0 && (
            <div style={{ position: "absolute", top: "100%", left: 0, right: 0, zIndex: 20, background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 8, marginTop: 4, maxHeight: 260, overflowY: "auto", boxShadow: "0 4px 12px rgba(0,0,0,.12)" }}>
              {suggestions.map((c) => (
                <div
                  key={c.id}
                  onClick={() => {
                    setCenter({ lat: c.lat, lon: c.lon });
                    setCenterLabel(c.nom_public || c.nom);
                    setSearch("");
                  }}
                  style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 10px", cursor: "pointer", fontSize: 12.5, borderBottom: "1px solid " + PALETTE.line }}
                >
                  <span>{c.nom_public || c.nom} <span style={{ color: PALETTE.inkSoft }}>({c.ville})</span></span>
                  {c.statut === "prospect" && <span style={{ fontSize: 10, background: "#DCEAF5", color: "#2E5F82", padding: "2px 6px", borderRadius: 10, fontWeight: 600 }}>PROSPECT</span>}
                </div>
              ))}
            </div>
          )}
        </div>
        {searchError && <div style={{ fontSize: 12, color: PALETTE.rust, marginBottom: 8 }}>{searchError}</div>}
        {geocoded.length === 0 && (
          <div style={{ fontSize: 12.5, color: PALETTE.inkSoft, marginBottom: 8 }}>
            Aucun client localise pour l'instant &mdash; utilisez le bouton de localisation dans l'onglet Importer.
          </div>
        )}
        <div style={{ display: "flex", gap: 14, marginBottom: 8, fontSize: 11.5, color: PALETTE.inkSoft, flexWrap: "wrap" }}>
          <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: "#3E4E31", marginRight: 4 }} />Mes clients</span>
          <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: "#B8863B", marginRight: 4 }} />Clients Steven / Celliers</span>
          <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: "#A8462F", marginRight: 4 }} />A relancer</span>
          <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: "#2E5F82", marginRight: 4 }} />Prospect</span>
        </div>
        <div ref={mapDivRef} style={{ height: isMobile ? 340 : 560, borderRadius: 8, overflow: "hidden" }} />
      </div>

      <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: PALETTE.ink, marginBottom: 10 }}>
          {center ? "Clients les plus proches de " + centerLabel : geocoded.length + " client(s) localise(s)"}
        </div>
        <div style={{ maxHeight: 540, overflowY: "auto" }}>
          {(center ? nearest : geocoded).map((c) => {
            const isAlert = c.joursDepuis !== null && c.joursDepuis !== undefined && c.joursDepuis >= 45;
            const isProspect = c.statut === "prospect";
            const isMine = (c.commercial || "Pierre") === "Pierre";
            const statusColor = isProspect ? "#2E5F82" : isAlert ? "#A8462F" : isMine ? "#3E4E31" : "#B8863B";
            return (
              <div key={c.id} style={{ padding: "8px 4px 8px 10px", borderBottom: "1px solid " + PALETTE.line, borderLeft: "3px solid " + statusColor }}>
                <div
                  onClick={() => onSelectClient && onSelectClient(c)}
                  style={{ fontSize: 13, fontWeight: 500, color: PALETTE.ink, cursor: onSelectClient ? "pointer" : "default", textDecoration: onSelectClient ? "underline" : "none" }}
                >
                  {c.nom_public || c.nom}
                </div>
                <div style={{ fontSize: 11.5, color: PALETTE.inkSoft, marginBottom: 4 }}>
                  {c.ville} {c.dist !== undefined ? "\u00b7 " + c.dist.toFixed(1) + " km" : ""}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <a href={wazeUrl(c.lat, c.lon)} target="_blank" rel="noreferrer" style={{ fontSize: 11, background: PALETTE.bottle, color: "#fff", padding: "3px 8px", borderRadius: 5, textDecoration: "none" }}>Waze</a>
                  <a href={gmapsUrl(c.lat, c.lon)} target="_blank" rel="noreferrer" style={{ fontSize: 11, background: PALETTE.goldDark, color: "#fff", padding: "3px 8px", borderRadius: 5, textDecoration: "none" }}>Google Maps</a>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function DevisPane({ catalogue, clients }) {
  const [search, setSearch] = useState("");
  const [lines, setLines] = useState([]);
  const [clientSearch, setClientSearch] = useState("");
  const [selectedClient, setSelectedClient] = useState(null);
  const [manualNom, setManualNom] = useState("");
  const [manualEmail, setManualEmail] = useState("");

    if (!search.trim()) return [];

    return catalogue.filter((p) => (p.nom_recherche || p.designation).toLowerCase().includes(q) || p.designation.toLowerCase().includes(q) || p.code.includes(q)).slice(0, 12);

  const clientResults = useMemo(() => {
    if (!clientSearch.trim()) return [];
    const q = clientSearch.toLowerCase();
    return clients.filter((c) => c.nom.toLowerCase().includes(q)).slice(0, 8);

  function addLine(p) {
    if (lines.find((l) => l.code === p.code)) return;
    setLines((prev) => [
      ...prev,
      {
        code: p.code,
        designation: p.nom_recherche || p.designation,
        format: p.format,
        qte_carton: p.qte_carton || 1,

        gratuite: "",

    setSearch("");

  function updateLine(code, patch) {
    setLines((prev) => prev.map((l) => (l.code === code ? { ...l, ...patch } : l)));

  function removeLine(code) {
    setLines((prev) => prev.filter((l) => l.code !== code));

  function prixCartonNet(l) {
    return l.prix_carton_liste * (1 - (l.remise || 0) / 100);
  }
  function prixUniteNet(l) {

  const destEmail = selectedClient ? selectedClient.email : manualEmail;

  function buildEmailBody() {

      if (l.remise > 0) ligne += " (remise " + l.remise + "% incluse, prix catalogue " + fmtEuro(l.prix_carton_liste / l.qte_carton) + ")";
      ligne += "\n    Prix carton HT (" + l.qte_carton + " unites) : " + fmtEuro(prixCartonNet(l));
      if (l.gratuite) ligne += "\n    Offre : " + l.gratuite + " cartons offerts";
      body += ligne + "\n\n";
    });
    body += "N'hesitez pas a nous contacter pour toute question ou pour passer commande.\n\nCordialement,\n" + SOCIETE.nom;
    return body;

  function openMailto() {

              {searchResults.map((p) => (

                  <span style={{ fontWeight: 600 }}>{fmtEuro(p.prix_unitaire_ht ?? p.prix_ht)}</span>

      </div>

      <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 16 }}>

        <div style={{ fontSize: 11.5, color: PALETTE.inkSoft, marginBottom: 10 }}>

        {lines.length === 0 ? (

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {lines.map((l) => (
              <div key={l.code} style={{ border: "1px solid " + PALETTE.line, borderRadius: 8, padding: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8, gap: 8 }}>
                  <div style={{ fontSize: 13, fontWeight: 500, color: PALETTE.ink }}>{l.designation} <span style={{ color: PALETTE.inkSoft, fontWeight: 400 }}>({l.format || DASH}, carton de {l.qte_carton})</span></div>

                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center" }}>

                      <button key={r} onClick={() => updateLine(l.code, { remise: r })} style={{

                        border: "1px solid " + (l.remise === r ? PALETTE.bottle : PALETTE.line),
                        background: l.remise === r ? PALETTE.bottle : "transparent",

                  </div>
                  <div style={{ fontSize: 11.5, color: PALETTE.inkSoft, display: "flex", alignItems: "center", gap: 4 }}>

                    <input
                      placeholder="autre (ex: 15+2)"

                    <div style={{ fontSize: 10.5, color: PALETTE.inkSoft }}>Prix carton HT</div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: PALETTE.ink }}>

                    <div style={{ fontSize: 14, fontWeight: 700, color: PALETTE.goldDark }}>

                      {l.remise > 0 && <span style={{ fontSize: 11, color: PALETTE.inkSoft, fontWeight: 400, textDecoration: "line-through", marginLeft: 6 }}>{fmtEuro(l.prix_carton_liste / l.qte_carton)}</span>}
                    </div>
                  </div>

              </div>
            ))}

        {lines.length > 0 && (
          <div style={{ display: "flex", gap: 8, marginTop: 14, paddingTop: 12, borderTop: "1px solid " + PALETTE.line, flexWrap: "wrap" }}>
            <button onClick={openMailto} style={primaryBtnStyle}>Ouvrir dans ma messagerie</button>
            <button onClick={copyText} style={secondaryBtnStyle}>{copied ? "Copie !" : "Copier le texte"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

function buildClientsWithOrders(clientsRaw, commandes, monthsOrder) {
  const byClient = {};
  for (const row of commandes) {
    const key = row.client_nom_norm;
    byClient[key] = byClient[key] || {};
    const pKey = row.code_produit;
    if (!byClient[key][pKey]) {
      byClient[key][pKey] = {
        c: row.code_produit,
        n: row.designation,
        cat: row.categorie,
        q: 0,
        m: 0,
        h: new Array(monthsOrder.length).fill(0),
      };
    }
    const entry = byClient[key][pKey];
    entry.q += row.quantite || 0;
    entry.m += row.montant || 0;
    const idx = monthsOrder.findIndex((mo) => mo.y === row.annee && mo.m === row.mois);
    if (idx >= 0) entry.h[idx] += row.quantite || 0;
  }

  const primaryYear = monthsOrder.length ? Math.max(...monthsOrder.map((m) => m.y)) : null;
  const secondaryYear = primaryYear ? primaryYear - 1 : null;
  const primaryMonthCount = monthsOrder.filter((m) => m.y === primaryYear).length;

  return clientsRaw.map((c) => {
    const prodMap = byClient[c.nom_norm] || {};
    const prod = Object.values(prodMap);
    let caPrimary = 0, caSecondary = 0;
    for (const row of commandes) {
      if (row.client_nom_norm !== c.nom_norm) continue;
      if (row.annee === primaryYear) caPrimary += row.montant || 0;
      if (row.annee === secondaryYear) caSecondary += row.montant || 0;
    }
    return {
      ...c,
      id: c.nom_norm,
      prod,
      caPrimary, caSecondary,
      joursDepuis: daysSince(c.derniere_commande),
      // un prospect qui a de vraies commandes (import) redevient automatiquement un client,
      // sans jamais avoir besoin de cliquer sur "Convertir"
      statut: c.statut === "prospect" && prod.length === 0 ? "prospect" : "client",
    };
  });
}

function buildClientInsights(client, monthsOrder) {
  if (!client || !client.prod || client.prod.length === 0) return [];
  const byCat = {};
  client.prod.forEach((p) => {
    const cat = p.cat || "Autres";
    if (!byCat[cat]) byCat[cat] = { h: new Array(monthsOrder.length).fill(0), products: [] };
    p.h.forEach((v, i) => { byCat[cat].h[i] += v; });
    byCat[cat].products.push(p);
  });

  function lastOrderInfo(h) {
    const total = h.reduce((s, v) => s + v, 0);
    let lastIdx = null;
    for (let i = h.length - 1; i >= 0; i--) { if (h[i] > 0) { lastIdx = i; break; } }
    if (lastIdx === null) return null;
    return { total, monthsSince: h.length - 1 - lastIdx, lastLabel: monthLabel(monthsOrder[lastIdx].y, monthsOrder[lastIdx].m) };
  }

  const stopped = [];
  const switched = [];

  Object.entries(byCat).forEach(([cat, data]) => {
    const catInfo = lastOrderInfo(data.h);
    if (!catInfo) return;
    const catIsQuiet = catInfo.monthsSince >= 3 && catInfo.total >= 2;

    if (catIsQuiet) {
      // toute la categorie s'est arretee : alerte forte
      stopped.push({ cat, monthsSince: catInfo.monthsSince, lastLabel: catInfo.lastLabel });
    } else {
      // la categorie est toujours active : on regarde si un produit precis a ete abandonne
      // (signe probable d'un changement de marque, pas d'un vrai decrochage)
      data.products.forEach((p) => {
        const pInfo = lastOrderInfo(p.h);
        if (pInfo && pInfo.monthsSince >= 3 && pInfo.total >= 2) {
          switched.push({ cat, produit: p.n, monthsSince: pInfo.monthsSince, lastLabel: pInfo.lastLabel });
        }
      });
    }
  });

  stopped.sort((a, b) => b.monthsSince - a.monthsSince);
  switched.sort((a, b) => b.monthsSince - a.monthsSince);
  return { stopped, switched };
}

function SuiviClientsApp({ onLogout }) {
  const isMobile = useIsMobile();
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [rawClients, setRawClients] = useState([]);
  const [catalogue, setCatalogue] = useState([]);
  const [commandes, setCommandes] = useState([]);
  const [monthsOrder, setMonthsOrder] = useState([]);
  const [deletedIds, setDeletedIds] = useState([]);
  const [reloadKey, setReloadKey] = useState(0);

  const [tab, setTab] = useState("clients");
  const [search, setSearch] = useState("");
  const [deptFilter, setDeptFilter] = useState("TOUS");
  const [commFilter, setCommFilter] = useState("TOUS");
  const [commercialFilter, setCommercialFilter] = useState("TOUS");
  const [alertThreshold, setAlertThreshold] = useState(45);
  const [sortBy, setSortBy] = useState("relance");
  const [selectedId, setSelectedId] = useState(null);
  const [viewMode, setViewMode] = useState("actifs"); // actifs | sans_stats | prospects | supprimes
  const [confirmingDelete, setConfirmingDelete] = useState(false);

  const loadAll = useCallback(async () => {
    setLoading(true);
    setLoadError(null);
    try {
      const [clientsData, catalogueData, commandesData, deletedData] = await Promise.all([
        sbFetchAll("clients?select=*&order=nom.asc"),
        sbFetchAll("produits_catalogue?select=*"),
        sbFetchAll("commandes_mensuelles?select=*"),
        sbFetchAll("deleted_clients?select=client_nom_norm"),
      ]);
      const monthSet = {};
      commandesData.forEach((r) => { monthSet[r.annee + "-" + r.mois] = { y: r.annee, m: r.mois }; });
      const months = Object.values(monthSet).sort((a, b) => (a.y - b.y) || (a.m - b.m));

      setRawClients(clientsData);
      setCatalogue(catalogueData);
      setCommandes(commandesData);
      setMonthsOrder(months);
      setDeletedIds(deletedData.map((d) => d.client_nom_norm));
    } catch (e) {
      setLoadError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadAll(); }, [loadAll, reloadKey]);

  const clients = useMemo(() => buildClientsWithOrders(rawClients, commandes, monthsOrder), [rawClients, commandes, monthsOrder]);

  useEffect(() => { setConfirmingDelete(false); }, [selectedId]);

  const departements = useMemo(() => {
    const set = new Set(clients.map((c) => c.dept).filter(Boolean));
    return Array.from(set).sort();
  }, [clients]);

  const commerciaux = useMemo(() => {
    const set = new Set(clients.map((c) => c.commercial).filter(Boolean));
    return Array.from(set).sort();
  }, [clients]);

  const filtered = useMemo(() => {
    let list = clients.filter((c) => {
      const isDeleted = deletedIds.includes(c.id);
      const isProspect = c.statut === "prospect";
      const hasStats = c.prod.length > 0;
      let matchView;
      if (viewMode === "supprimes") matchView = isDeleted;
      else if (viewMode === "prospects") matchView = !isDeleted && isProspect;
      else if (viewMode === "sans_stats") matchView = !isDeleted && !isProspect && !hasStats;
      else matchView = !isDeleted && !isProspect && hasStats; // actifs
      if (!matchView) return false;
      const matchSearch =
        search.trim() === "" ||
        c.nom.toLowerCase().includes(search.toLowerCase()) ||
        (c.nom_public || "").toLowerCase().includes(search.toLowerCase()) ||
        (c.ville || "").toLowerCase().includes(search.toLowerCase());
      const matchDept = deptFilter === "TOUS" || c.dept === deptFilter;
      const matchComm = commFilter === "TOUS" || c.commission === commFilter;
      const matchCommercial = commercialFilter === "TOUS" || c.commercial === commercialFilter;
      return matchSearch && matchDept && matchComm && matchCommercial;
    });
    list = [...list].sort((a, b) => {
      if (sortBy === "nom") return a.nom.localeCompare(b.nom);
      if (sortBy === "ville") return (a.ville || "").localeCompare(b.ville || "");
      if (sortBy === "ca") return (b.caPrimary || 0) - (a.caPrimary || 0);
      if (sortBy === "relance") {
        const da = a.joursDepuis === null ? 999999 : a.joursDepuis;
        const db = b.joursDepuis === null ? 999999 : b.joursDepuis;
        return db - da;
      }
      return 0;
    });
    return list;
  }, [clients, search, deptFilter, commFilter, commercialFilter, sortBy, deletedIds, viewMode]);

  useEffect(() => {
    if (!selectedId && filtered.length) setSelectedId(filtered[0].id);
  }, [filtered, selectedId]);

  // (le reset de selectedId se fait desormais directement dans chaque bouton de changement de vue,
  // pas ici, pour ne pas ecraser la selection faite depuis un clic sur la carte)

  const selected = filtered.find((c) => c.id === selectedId) || filtered[0];

  async function deleteClient(id) {
    try {
      await sbFetch("deleted_clients", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates" },

      });
      setDeletedIds((prev) => [...new Set([...prev, id])]);
      setConfirmingDelete(false);
    } catch (e) {}
  }
  async function restoreClient(id) {
    try {
      await sbFetch("deleted_clients?client_nom_norm=eq." + encodeURIComponent(id), { method: "DELETE" });
      setDeletedIds((prev) => prev.filter((x) => x !== id));
    } catch (e) {}
  }
  async function convertProspect(id) {
    try {
      await sbFetch("clients?nom_norm=eq." + encodeURIComponent(id), {
        method: "PATCH",
        body: JSON.stringify({ statut: "client" }),
      });
      setReloadKey((k) => k + 1);
    } catch (e) {}
  }

  const nbAlertes = clients.filter((c) => c.joursDepuis !== null && c.joursDepuis >= alertThreshold).length;
  const nbP1 = clients.filter((c) => c.commission === "P1").length;
  const nbP3 = clients.filter((c) => c.commission === "P3").length;

  const primaryYear = monthsOrder.length ? Math.max(...monthsOrder.map((m) => m.y)) : null;
  const secondaryYear = primaryYear ? primaryYear - 1 : null;
  const primaryMonthCount = monthsOrder.filter((m) => m.y === primaryYear).length;
  const caTotalPrimary = clients.reduce((s, c) => s + (c.caPrimary || 0), 0);
  const caTotalSecondary = clients.reduce((s, c) => s + (c.caSecondary || 0), 0);

  const deptCounts = useMemo(() => {
    const m = {};
    clients.forEach((c) => { if (c.dept && c.statut !== "prospect" && !deletedIds.includes(c.id)) m[c.dept] = (m[c.dept] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 12);
  }, [clients, deletedIds]);
  const maxDeptCount = Math.max(...deptCounts.map((d) => d[1]), 1);

  if (loading && rawClients.length === 0) {
    return (
      <div style={{ minHeight: "100vh", background: PALETTE.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "sans-serif", color: PALETTE.inkSoft }}>
        Chargement des donnees depuis la base...
      </div>
    );
  }

  if (loadError) {
    return (
      <div style={{ minHeight: "100vh", background: PALETTE.bg, padding: 40, fontFamily: "sans-serif" }}>
        <div style={{ color: PALETTE.rust, fontWeight: 600, marginBottom: 8 }}>Erreur de chargement</div>
        <div style={{ color: PALETTE.inkSoft, fontSize: 13 }}>{loadError}</div>
        <button onClick={() => setReloadKey((k) => k + 1)} style={{ ...primaryBtnStyle, marginTop: 12 }}>Reessayer</button>
      </div>
    );
  }

  return (
    <div style={{ background: PALETTE.bg, color: PALETTE.ink, fontFamily: 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif', minHeight: "100vh", padding: isMobile ? "14px" : "28px" }}>
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 6, flexWrap: "wrap", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <img src={"data:image/png;base64," + LOGO_B64} alt="Logo" style={{ height: 52, width: "auto" }} />
            <div style={{ minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
                <h1 style={{ fontFamily: 'Georgia, "Iowan Old Style", serif', fontSize: 26, fontWeight: 700, margin: 0, color: PALETTE.bottleDark, letterSpacing: "-0.01em" }}>
                  Registre des comptoirs
                </h1>

                                <td style={{ padding: "6px 4px", textAlign: "right", fontWeight: 600, color: PALETTE.ink, whiteSpace: "nowrap" }}>{p.q} cartons</td>

                      </button>
                    )}
                  </div>
                </>
              ) : (
                <div style={{ color: PALETTE.inkSoft, fontSize: 13 }}>Selectionnez un client dans la liste.</div>
              )}
            </div>
          </div>

          <div style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 12, padding: 16, marginTop: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: PALETTE.ink }}>Repartition des vrais clients par departement (top 12, hors prospects)</div>
              <div style={{ fontSize: 11.5, color: PALETTE.inkSoft }}>Carte geographique activee des reception des adresses geocodees</div>
            </div>
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
              {deptCounts.map(([dept, count]) => (
                <div key={dept} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 60, fontSize: 12, color: PALETTE.inkSoft }}>Dept. {dept}</div>
                  <div style={{ flex: 1, background: PALETTE.bg, borderRadius: 6, height: 14 }}>
                    <div style={{ width: (count / maxDeptCount) * 100 + "%", background: PALETTE.bottle, height: "100%", borderRadius: 6 }} />
                  </div>
                  <div style={{ width: 26, fontSize: 12, textAlign: "right", color: PALETTE.ink }}>{count}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function LoginScreen({ onLoggedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      await authSignIn(email.trim(), password);
      onLoggedIn();
    } catch (err) {
      setError("Email ou mot de passe incorrect.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: PALETTE.bg, padding: 20 }}>
      <form onSubmit={handleSubmit} style={{ background: PALETTE.paper, border: "1px solid " + PALETTE.line, borderRadius: 14, padding: 32, width: "100%", maxWidth: 360, display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <img src={"data:image/png;base64," + LOGO_B64} alt="Logo" style={{ height: 56, width: "auto", margin: "0 auto 10px" }} />
          <div style={{ fontFamily: 'Georgia, "Iowan Old Style", serif', fontSize: 18, fontWeight: 700, color: PALETTE.bottleDark }}>Registre des comptoirs</div>
          <div style={{ fontSize: 12, color: PALETTE.inkSoft }}>Les Celliers Bretons</div>
        </div>
        <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required style={inputStyle} autoComplete="username" />
        <input type="password" placeholder="Mot de passe" value={password} onChange={(e) => setPassword(e.target.value)} required style={inputStyle} autoComplete="current-password" />
        {error && <div style={{ fontSize: 12.5, color: PALETTE.rust }}>{error}</div>}
        <button type="submit" disabled={loading} style={{ ...primaryBtnStyle, width: "100%", padding: "10px 0" }}>
          {loading ? "Connexion..." : "Se connecter"}
        </button>
        <div style={{ fontSize: 11, color: PALETTE.inkSoft, textAlign: "center" }}>
          Vous restez connecte sur cet appareil apres la premiere connexion.
        </div>
      </form>
    </div>
  );
}

function SuiviClients() {
  const [authChecked, setAuthChecked] = useState(false);
  const [session, setSession] = useState(null);

  useEffect(() => {
    let cancelled = false;
    ensureValidSession().then((s) => {
      if (!cancelled) {
        setSession(s);
        setAuthChecked(true);
      }
    });
    return () => { cancelled = true; };
  }, []);

  if (!authChecked) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: PALETTE.inkSoft, fontFamily: "sans-serif" }}>
        Chargement...
      </div>
    );
  }

  if (!session) {
    return <LoginScreen onLoggedIn={() => setSession(getStoredSession())} />;
  }

  return <SuiviClientsApp onLogout={() => { authSignOut(); setSession(null); }} />;
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SuiviClients />);
</script>
</body>
</html>
